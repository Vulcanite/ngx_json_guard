load_module /opt/ngx-json-guard/nginx/modules/ngx_http_json_guard_module.so;
load_module /opt/ngx-json-guard/nginx/modules/ngx_http_modsecurity_module.so;

worker_processes auto;
error_log /var/log/ngx-json-guard/nginx-error.log warn;
pid /run/ngx-json-guard/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /opt/ngx-json-guard/nginx/conf/mime.types;
    default_type application/octet-stream;

    log_format benchmark '$request_id status=$status method=$request_method '
                         'uri="$request_uri" bytes=$request_length '
                         'request_time=$request_time upstream_time=$upstream_response_time '
                         'guard_us=$json_guard_inspection_us';
    access_log /var/log/ngx-json-guard/nginx-access.log benchmark;

    client_max_body_size 128m;
    client_body_buffer_size 64k;
    client_body_in_file_only clean;
    client_body_temp_path /var/lib/ngx-json-guard/client_body_temp 1 2;
    proxy_temp_path /var/lib/ngx-json-guard/proxy_temp 1 2;

    json_guard_allow_top_level_scalar on;
    json_guard_max_depth 100;
    json_guard_max_key_length 4096;
    json_guard_max_string_length 67108864;
    json_guard_max_number_length 256;
    json_guard_max_total_tokens 100000;
    json_guard_max_object_members 10000;
    json_guard_max_array_elements 10000;
    json_guard_reject_duplicate_keys off;

    upstream native_sink {
        server __BACKEND_HOST__:__BACKEND_PORT__;
        keepalive 32;
    }

    modsecurity_rules_file /etc/ngx-json-guard/modsecurity/active.conf;

    server {
        listen 127.0.0.1:8091;
        server_name waf.local;

        add_header X-Benchmark-Engine "native-nginx" always;
        add_header X-Json-Guard-Inspection-Us $json_guard_inspection_us always;

        location /json/ {
            include /etc/ngx-json-guard/nginx/profile.conf;
            proxy_pass http://native_sink;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location /xml/ {
            include /etc/ngx-json-guard/nginx/profile.conf;
            proxy_pass http://native_sink;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location /form/ {
            include /etc/ngx-json-guard/nginx/profile.conf;
            proxy_pass http://native_sink;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location /web/ {
            include /etc/ngx-json-guard/nginx/profile.conf;
            proxy_pass http://native_sink;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location = /healthz {
            json_guard off;
            modsecurity off;
            access_log off;
            return 200 "ok\n";
        }
    }
}

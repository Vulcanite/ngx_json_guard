SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

SecRequestBodyLimit 134217728
SecRequestBodyInMemoryLimit 65536
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 100
SecArgumentsLimit 10001

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^[45]"
SecAuditLog /var/log/coraza/audit.log
SecAuditLogFormat JSON

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*application/(?:[a-z0-9!#$&^_.+-]+\+)?json\s*(?:;|$)" \
    "id:240001,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*(?:application/(?:[a-z0-9!#$&^_.+-]+\+)?xml|text/xml)\s*(?:;|$)" \
    "id:240002,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=XML"

SecAction \
    "id:240003,phase:1,pass,nolog,t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"

SecRule &ARGS "@ge 10001" \
    "id:240004,phase:2,deny,status:413,log,msg:'Request argument limit exceeded'"

SecRule REQBODY_ERROR "!@eq 0" \
    "id:240005,phase:2,deny,status:400,log,msg:'Request body processor error'"

Include @crs-setup.conf.example
Include @owasp_crs/*.conf

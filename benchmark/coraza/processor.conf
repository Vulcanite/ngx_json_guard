SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

SecRequestBodyLimit 134217728
SecRequestBodyInMemoryLimit 65536
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 100
SecArgumentsLimit 10001

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^[45]"
SecAuditLog /var/log/coraza/audit.log
SecAuditLogFormat JSON

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*application/(?:[a-z0-9!#$&^_.+-]+\+)?json\s*(?:;|$)" \
    "id:230001,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*(?:application/(?:[a-z0-9!#$&^_.+-]+\+)?xml|text/xml)\s*(?:;|$)" \
    "id:230002,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=XML"

SecRule &ARGS "@ge 10001" \
    "id:230003,phase:2,deny,status:413,log,msg:'Request argument limit exceeded'"

SecRule REQBODY_ERROR "!@eq 0" \
    "id:230004,phase:2,deny,status:400,log,msg:'Request body processor error'"

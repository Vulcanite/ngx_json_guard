SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

SecRequestBodyLimit 134217728
SecRequestBodyNoFilesLimit 134217728
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 100
SecArgumentsLimit 10001

SecTmpDir /tmp/
SecDataDir /tmp/
SecUnicodeMapFile /etc/nginx/modsec/unicode.mapping 20127

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*application/(?:[a-z0-9!#$&^_.+-]+\+)?json\s*(?:;|$)" \
    "id:210001,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*(?:application/(?:[a-z0-9!#$&^_.+-]+\+)?xml|text/xml)\s*(?:;|$)" \
    "id:210002,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=XML"

SecRule &ARGS "@ge 10001" \
    "id:210003,phase:2,deny,status:413,log,msg:'Request argument limit exceeded'"

SecRule REQBODY_ERROR "!@eq 0" \
    "id:210004,phase:2,deny,status:400,log,msg:'Request body processor error'"

# Constrained multi-application WAF lab: ngx_json_guard + full OWASP CRS.

load_module modules/ngx_http_json_guard_module.so;
load_module modules/ngx_http_modsecurity_module.so;

worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format perf '$request_id status=$status method=$request_method uri="$request_uri" '
                    'bytes=$request_length request_time=$request_time '
                    'upstream_time=$upstream_response_time guard_us=$json_guard_inspection_us';
    access_log /var/log/nginx/access.log perf;

    client_max_body_size 128m;
    client_body_buffer_size 64k;
    client_body_in_file_only clean;
    client_body_temp_path /tmp/client_body_temp 1 2;

    # Bounded admission limits appropriate for the 4 GiB WAF node profile.
    json_guard_allow_top_level_scalar on;
    json_guard_max_depth 100;
    json_guard_max_key_length 4096;
    json_guard_max_string_length 67108864;
    json_guard_max_number_length 256;
    json_guard_max_total_tokens 100000;
    json_guard_max_object_members 10000;
    json_guard_max_array_elements 10000;
    json_guard_reject_duplicate_keys off;

    upstream json_api_backend { server json_api:9000; keepalive 32; }
    upstream xml_api_backend  { server xml_api:9000; keepalive 32; }
    upstream form_api_backend { server form_api:9000; keepalive 32; }
    upstream web_app_backend  { server web_app:9000; keepalive 32; }

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    server {
        listen 8080;
        server_name _;

        location /json/ {
            json_guard on;
            add_header X-Json-Guard-Inspection-Us $json_guard_inspection_us always;
            add_header X-WAF-Request-ID $request_id always;
            proxy_pass http://json_api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        # Compatibility path used by the existing load generators.
        location = /ingest {
            json_guard on;
            add_header X-Json-Guard-Inspection-Us $json_guard_inspection_us always;
            add_header X-WAF-Request-ID $request_id always;
            proxy_pass http://json_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location /xml/ {
            json_guard off;
            add_header X-WAF-Request-ID $request_id always;
            proxy_pass http://xml_api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location /form/ {
            json_guard off;
            add_header X-WAF-Request-ID $request_id always;
            proxy_pass http://form_api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location /web/ {
            json_guard off;
            add_header X-WAF-Request-ID $request_id always;
            proxy_pass http://web_app_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location /healthz {
            modsecurity off;
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # Loopback-only differential endpoints. Never expose this listener.
    server {
        listen 127.0.0.1:8082;
        server_name inspection_benchmark;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
        proxy_request_buffering on;

        location = /both {
            json_guard on;
            modsecurity on;
            add_header X-Json-Guard-Inspection-Us $json_guard_inspection_us always;
            proxy_pass http://json_api_backend/ingest;
        }

        location = /guard-only {
            json_guard on;
            modsecurity off;
            add_header X-Json-Guard-Inspection-Us $json_guard_inspection_us always;
            proxy_pass http://json_api_backend/ingest;
        }

        location = /baseline {
            json_guard off;
            modsecurity off;
            proxy_pass http://json_api_backend/ingest;
        }
    }
}

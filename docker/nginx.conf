# Docker integration NGINX config.
# This exact dynamic-module build is integration-tested to run json_guard's
# PREACCESS handler before ModSecurity body inspection. Verify ordering again
# when changing NGINX, connector, or module builds.

load_module modules/ngx_http_json_guard_module.so;
load_module modules/ngx_http_modsecurity_module.so;

worker_processes 1;
error_log /var/log/nginx/error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log combined;

    client_max_body_size 100m;
    client_body_buffer_size 16k;
    # Force spool-to-file so we exercise in-file body paths.
    client_body_in_file_only clean;
    client_body_temp_path /tmp/client_body_temp 1 2;

    # Upstream echo backend (body preservation proof).
    upstream echo_backend {
        server 127.0.0.1:9000;
    }

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/minimal.conf;

    server {
        listen 8080;
        server_name _;

        # JSON API under guard + ModSecurity
        location /api/ {
            json_guard on;
            json_guard_max_depth 32;
            json_guard_max_string_length 1048576;
            json_guard_max_key_length 4096;
            json_guard_max_number_length 256;
            json_guard_max_total_tokens 2000000;
            json_guard_max_object_members 100000;
            json_guard_max_array_elements 100000;
            json_guard_allow_top_level_scalar off;
            json_guard_reject_duplicate_keys on;

            proxy_pass http://echo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type $http_content_type;
            proxy_request_buffering on;
            proxy_pass_request_body on;
        }

        # Same stack but json_guard disabled (ordering contrast).
        location /noguard/ {
            json_guard off;

            proxy_pass http://echo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_request_buffering on;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}

# Minimal deterministic configuration for module lifecycle integration tests.
# The API performance stack uses main.conf with the full OWASP CRS ruleset.

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

SecRequestBodyLimit 104857600
SecRequestBodyNoFilesLimit 104857600
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 100

SecTmpDir /tmp/
SecDataDir /tmp/
SecUnicodeMapFile /etc/nginx/modsec/unicode.mapping 20127

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log

SecArgumentSeparator &
SecCookieFormat 0

Include /etc/nginx/modsec/json_guard_integration_rules.conf

# Integration / demo rules for ngx_json_guard + ModSecurity.
# These prove that ModSecurity still sees the full request body after
# json_guard has stream-validated it. They are NOT a substitute for CRS.

# Marker at the end of a large body — if this matches, ModSecurity saw the
# full body (not a truncated prefix). Pass only; logs for proof.
SecRule REQUEST_BODY "@contains JG_TAIL_MARKER_7f3a9c" \
    "id:910001,\
    phase:2,\
    pass,\
    log,\
    auditlog,\
    msg:'json_guard integration: full body tail marker seen by ModSecurity',\
    tag:'json_guard_integration',\
    tag:'body_preservation'"

# Synthetic attack marker — ModSecurity must still block after json_guard
# accepts structurally valid JSON.
SecRule REQUEST_BODY "@contains JG_ATTACK_MARKER_sqli" \
    "id:910002,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'json_guard integration: attack marker blocked by ModSecurity',\
    tag:'json_guard_integration',\
    tag:'modsec_ordering'"

# Count that ModSecurity phase-2 ran for JSON API posts (debug aid).
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)application/([a-z0-9.+-]+)?json" \
    "id:910003,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.jg_json_ct=1"

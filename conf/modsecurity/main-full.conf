# Full OWASP CRS profile for comparison with the endpoint-tuned profile.

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

SecRequestBodyLimit 134217728
SecRequestBodyNoFilesLimit 134217728
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 100

SecTmpDir /tmp/
SecDataDir /tmp/
SecUnicodeMapFile /etc/nginx/modsec/unicode.mapping 20127

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log

SecArgumentSeparator &
SecCookieFormat 0

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*application/(?:[a-z0-9!#$&^_.+-]+\+)?json\s*(?:;|$)" \
    "id:200001,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*(?:application/(?:[a-z0-9!#$&^_.+-]+\+)?xml|text/xml)\s*(?:;|$)" \
    "id:200002,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=XML"

SecAction \
    "id:200004,phase:1,pass,nolog,t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"

SecRule REQBODY_ERROR "!@eq 0" \
    "id:200003,phase:2,deny,status:400,log,msg:'Request body processor error'"

Include /etc/nginx/modsec/crs/crs-setup.conf
Include /etc/nginx/modsec/crs/rules/*.conf

# Full OWASP CRS profile for the constrained multi-application WAF lab.

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# The WAF node is limited to 4 GiB. Keep one request bounded while allowing
# 20-100 MiB JSON performance tests; reject rather than inspect a prefix.
SecRequestBodyLimit 134217728
SecRequestBodyNoFilesLimit 134217728
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 100

SecTmpDir /tmp/
SecDataDir /tmp/
SecUnicodeMapFile /etc/nginx/modsec/unicode.mapping 20127

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log

SecArgumentSeparator &
SecCookieFormat 0

# Explicit processors are required for nested JSON/XML values to become
# inspectable collections. Matching includes optional media-type parameters.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*application/(?:[a-z0-9!#$&^_.+-]+\+)?json\s*(?:;|$)" \
    "id:200001,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*(?:application/(?:[a-z0-9!#$&^_.+-]+\+)?xml|text/xml)\s*(?:;|$)" \
    "id:200002,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=XML"

# This lab's web app accepts plain-text event bodies. Keep the allowlist
# explicit instead of disabling CRS protocol rule 920420.
SecAction \
    "id:200004,phase:1,pass,nolog,t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"

# Endpoint-specific JSON performance profile. Full CRS remains active for the
# web, form, and XML applications. JSON retains protocol checks, LFI/RFI/RCE,
# and the primary libinjection SQLi/XSS rules (942100 and 941100), while
# secondary regex families and language-specific PHP/Java/session rules are
# removed for this API. Validate these exclusions against each real API.
SecRule REQUEST_URI "@beginsWith /json/" \
    "id:200010,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveById=930100-930119,\
    ctl:ruleRemoveById=930121-931999,\
    ctl:ruleRemoveById=932100-932159,\
    ctl:ruleRemoveById=932161-932999,\
    ctl:ruleRemoveById=933100-934999,\
    ctl:ruleRemoveById=941101-941999,\
    ctl:ruleRemoveById=942101-942999,\
    ctl:ruleRemoveById=943100-944999"

# Keep body-parser failures fail closed. JSON Guard catches malformed JSON
# first; this also covers XML and any engine/backend parser discrepancy.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200003,phase:2,deny,status:400,log,msg:'Request body processor error'"

Include /etc/nginx/modsec/crs/crs-setup.conf
Include /etc/nginx/modsec/crs/rules/*.conf
